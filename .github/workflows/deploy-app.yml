# Deploy workflow for the XpertOne admin SPA.
#
# ONE-TIME SETUP IN THIS REPO
#   1. Settings -> Environments, create two:
#        dev   Deployment branches: Selected branches -> main
#        prod  Deployment branches: main, plus REQUIRED REVIEWERS
#   2. In EACH environment add a secret AWS_DEPLOY_ROLE_ARN with the full ARN:
#        dev   arn:aws:iam::473671718877:role/github-app-dev
#        prod  arn:aws:iam::473671718877:role/github-app-prod
#      (Also printed as XpertOne-Ci outputs AppDevRoleArn / AppProdRoleArn.)
#
#      The two roles are deliberately different. The dev role cannot write to
#      prod buckets, so a mistake in this file cannot reach production — the
#      environment selects the credentials, and prod's also needs approval.
#
#   3. In EACH environment add the app build VARIABLES. These are compiled into
#      the public bundle; names must match what src/config/env.ts and
#      vite.config.ts read:
#          VITE_APP_STAGE          dev: development   prod: production
#          VITE_APP_BASE_URL       /
#          VITE_APP_API_URL        dev: https://api.dev.rajanigroup.in
#          VITE_APP_USER_TYPE      salesInchargeAdmin
#          VITE_FIREBASE_CONFIG    single-line JSON web-app config
#          VITE_FIREBASE_VAPID_KEY FCM Web Push (VAPID) key
#          VITE_USE_MOCK_API       false   <- see note below
#      And the build SECRET (may also be a variable; both are read):
#          VITE_APP_ENCRYPT_KEY    key used to encrypt persisted storage
#
#      NOTE on VITE_USE_MOCK_API: src/config/env.ts defaults it to `true`. If it
#      is absent from the environment this workflow writes `false`, so a deploy
#      never silently ships the mock auth session. Set the variable to override.
#
#      NOTE on VITE_GOOGLE_MAPS_KEY: not written here. src/config/env.ts falls
#      back to the placeholder key committed in that file, so map pickers keep
#      using it until a real key is added to this workflow + the environments.
#
# WHAT IT DOES
#   push to main      -> deploys to dev
#   workflow_dispatch -> deploys to dev or prod (prod waits for approval)
#   Bucket and distribution ids are read from CloudFormation at run time, so
#   this file never hardcodes an account-specific value.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        required: true
        default: dev
        options: [dev, prod]

concurrency:
  group: deploy-app-${{ github.event.inputs.environment || 'dev' }}
  cancel-in-progress: false

permissions:
  id-token: write # REQUIRED: mints the OIDC token. Without it, the AWS step fails.
  contents: read

jobs:
  deploy:
    name: Deploy to ${{ github.event.inputs.environment || 'dev' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}
    timeout-minutes: 15

    env:
      AWS_REGION: ap-south-1
      BUCKET_OUTPUT_KEY: webBucketName
      DISTRIBUTION_OUTPUT_KEY: webDistributionId

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # .env.* is gitignored, so CI has no env at all unless we write one.
      # Without this step the bundle falls back to every default in
      # src/config/env.ts — localhost API, mock auth, placeholder keys.
      - name: Generate .env file
        env:
          VITE_APP_STAGE: ${{ vars.VITE_APP_STAGE }}
          VITE_APP_BASE_URL: ${{ vars.VITE_APP_BASE_URL }}
          VITE_APP_API_URL: ${{ vars.VITE_APP_API_URL }}
          VITE_APP_USER_TYPE: ${{ vars.VITE_APP_USER_TYPE }}
          VITE_FIREBASE_CONFIG: ${{ vars.VITE_FIREBASE_CONFIG }}
          VITE_FIREBASE_VAPID_KEY: ${{ vars.VITE_FIREBASE_VAPID_KEY }}
          VITE_USE_MOCK_API: ${{ vars.VITE_USE_MOCK_API }}
          # Read from both, so the key works whether it was added as an
          # environment secret or an environment variable.
          VITE_APP_ENCRYPT_KEY: ${{ secrets.VITE_APP_ENCRYPT_KEY || vars.VITE_APP_ENCRYPT_KEY }}
        run: |
          set -euo pipefail
          ENV="${{ github.event.inputs.environment || 'dev' }}"
          if [ "$ENV" = prod ]; then MODE=production; else MODE=development; fi

          # A missing encrypt key would silently fall back to the default in
          # src/config/env.ts, making every persisted session decryptable.
          if [ -z "${VITE_APP_ENCRYPT_KEY}" ]; then
            echo "::error::VITE_APP_ENCRYPT_KEY is not set in the '$ENV' environment (secret or variable)."
            exit 1
          fi
          if [ -z "${VITE_APP_API_URL}" ]; then
            echo "::error::VITE_APP_API_URL is not set in the '$ENV' environment."
            exit 1
          fi

          {
            echo "VITE_APP_STAGE=${VITE_APP_STAGE}"
            echo "VITE_APP_BASE_URL=${VITE_APP_BASE_URL:-/}"
            echo "VITE_APP_ENCRYPT_KEY=${VITE_APP_ENCRYPT_KEY}"
            echo "VITE_APP_API_URL=${VITE_APP_API_URL}"
            echo "VITE_APP_USER_TYPE=${VITE_APP_USER_TYPE}"
            echo "VITE_USE_MOCK_API=${VITE_USE_MOCK_API:-false}"
            echo "VITE_FIREBASE_CONFIG=${VITE_FIREBASE_CONFIG}"
            echo "VITE_FIREBASE_VAPID_KEY=${VITE_FIREBASE_VAPID_KEY}"
          } > ".env.${MODE}"
          echo "Wrote .env.${MODE} for $ENV (values hidden)."

      # `npm run build` is --mode development; prod must use build:prod so it
      # reads .env.production and builds with production defines.
      - name: Build
        run: |
          ENV="${{ github.event.inputs.environment || 'dev' }}"
          if [ "$ENV" = prod ]; then npm run build:prod; else npm run build; fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve bucket and distribution
        id: target
        run: |
          set -euo pipefail
          ENV="${{ github.event.inputs.environment || 'dev' }}"
          STACK="XpertOne-$([ "$ENV" = prod ] && echo Prod || echo Dev)-Assets"

          get() {
            aws cloudformation describe-stacks --stack-name "$STACK" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text
          }
          BUCKET="$(get "$BUCKET_OUTPUT_KEY")"
          DIST="$(get "$DISTRIBUTION_OUTPUT_KEY")"

          if [ -z "$BUCKET" ] || [ "$BUCKET" = "None" ]; then
            echo "::error::Could not resolve $BUCKET_OUTPUT_KEY from $STACK"
            exit 1
          fi
          if [ -z "$DIST" ] || [ "$DIST" = "None" ]; then
            echo "::error::Could not resolve $DISTRIBUTION_OUTPUT_KEY from $STACK"
            exit 1
          fi
          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"
          echo "distribution=$DIST" >> "$GITHUB_OUTPUT"
          echo "Bucket: $BUCKET / Distribution: $DIST"

      # Hashed filenames first, cached forever. Uploading these BEFORE the shell
      # means a visitor never gets a new index.html pointing at assets that have
      # not landed yet.
      - name: Upload hashed assets
        run: |
          aws s3 sync dist/assets/ "s3://${{ steps.target.outputs.bucket }}/assets/" \
            --cache-control "public, max-age=31536000, immutable"

      # Then everything else, with --delete to drop removed files. index.html
      # must not be cached, or the CDN keeps serving a shell that references
      # assets from the previous build.
      - name: Upload shell
        run: |
          aws s3 sync dist/ "s3://${{ steps.target.outputs.bucket }}/" \
            --delete --exclude "assets/*" \
            --cache-control "public, max-age=0, must-revalidate"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.target.outputs.distribution }}" \
            --paths "/" "/index.html"
