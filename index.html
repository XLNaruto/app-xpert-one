<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XpertOne</title>
    <meta
      name="description"
      content="XpertOne — enterprise admin suite. Manage your entire organization from one secure workspace."
    />

    <link rel="icon" type="image/jpeg" href="/media/logos/xo-logo.png" />
    <!-- iOS composites touch icons onto a solid tile, so use the opaque JPG -->
    <link rel="apple-touch-icon" href="/media/logos/xo-logo.png" />

    <!-- Social preview — crawlers need an opaque, absolute-sized image -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="XpertOne" />
    <meta property="og:title" content="XpertOne — Enterprise Admin Suite" />
    <meta
      property="og:description"
      content="Manage your entire organization from one secure workspace."
    />
    <meta property="og:image" content="/media/logos/xo-logo.png" />
    <meta property="og:image:width" content="900" />
    <meta property="og:image:height" content="900" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="/media/logos/xo-logo.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
